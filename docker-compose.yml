services:
  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:latest-amd-gpu
    container_name: betbot-paddleocr-vlm-server
    user: root
    devices:
      - /dev:/dev
    shm_size: "64gb"
    network_mode: host
    volumes:
      - ./:/workspace
    command: >
      paddleocr genai_server
      --model_name PaddleOCR-VL-1.6-0.9B
      --host 0.0.0.0
      --port 8118
      --backend vllm
      --backend_config /workspace/config/vllm_config.yaml
    restart: unless-stopped

  screenscraper:
    build:
      context: .
      dockerfile: Dockerfile.screenscraper
    container_name: betbot-screenscraper
    working_dir: /workspace
    network_mode: host
    volumes:
      - ./:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
    environment:
      DISPLAY: ":0"
      XAUTHORITY: "/root/.Xauthority"
      PYTHONUNBUFFERED: "1"
      BETBOT_INPUT_DIR: "/workspace/data/input"
      BETBOT_OUTPUT_DIR: "/workspace/data/output"
      FLAGS_use_mkldnn: "0"
      FLAGS_enable_onednn_fusion: "0"
      PADDLEOCR_VL_SERVER_URL: "http://127.0.0.1:8118/v1"
    command: python /workspace/ScreenScraper/main.py
    restart: "no"
    depends_on:
      - paddleocr-vlm-server

  betbot-agent:
    build:
      context: .
      dockerfile: Dockerfile.ia
    container_name: betbot-agent-train
    working_dir: /workspace
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      # Numeric GIDs, not names: the rocm/pytorch image's /etc/group doesn't
      # define "render", and docker resolves group_add names against the
      # container's /etc/group, not the host's. Defaults below match this
      # host (`getent group render video`); override via RENDER_GID/VIDEO_GID
      # env vars if rebuilding on a different machine.
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: "8gb"
    volumes:
      - ./:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HOME: "/root/.cache/huggingface"
      BETBOT_DATA_DIR: "/workspace/data"
      BETBOT_AI_DIR: "/workspace/AI"
      # RX 7700 XT is gfx1101, not officially in ROCm's support list yet;
      # this makes it identify as the supported gfx1100 (7900-series) target.
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
    command: python /workspace/AI/train/train.py
    restart: "no"
    profiles: ["train"]